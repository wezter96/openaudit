apiVersion: v1
kind: ConfigMap
metadata:
  name: settings
data:
  LOG_LEVEL: info
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: "two"
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.27
          imagePullPolicyy: Always
---
apiVersion: v1
kind: Pod
metadata:
  name: broken
spec:
  restartPolicy: Never
---
apiVersion: v1
kind: Service
metadata:
  name: web
  name: web-dup
spec:
  ports:
    - port: 80
