openapi: 3.1.0
info: {title: Secure, version: "1"}
servers:
  - url: https://api.example.com
security:
  - bearer: []
paths:
  /things:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: {type: string}
      responses:
        "201": {description: created}
        "401": {description: unauthorized}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer}
