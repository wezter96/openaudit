name: Pages

# Publishes openaudit's audit of itself (the interactive HTML report plus the
# JSON, SARIF and Markdown versions) and the architecture diagram to GitHub
# Pages, so the README can link to a live, current example.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Audit this repository
        # The page is published whatever the result; CI is where the gate lives.
        run: bun apps/cli/src/bin.ts . --format html,json,sarif,markdown --out _site/report --fail-on none --quiet
      - name: Assemble the site
        run: |
          mv _site/report/openaudit-report.html _site/report/index.html
          bun docs/architecture.ts
          cp docs/architecture.html _site/architecture.html
          cp docs/site-index.html _site/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
