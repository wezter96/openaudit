name: Site

# Builds the website (apps/site) and deploys it to openaudit.se as a Cloudflare
# Worker with static assets. The build audits this repository for /report/
# (the interactive HTML report plus the JSON, SARIF and Markdown versions) and
# regenerates /architecture/, so both are current on every push.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Build-time settings the web app and API validate (see .env.schema).
      VITE_SERVER_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:3001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Generate types
        # Creates the generated files (env typings, Astro and router types,
        # project-reference declarations) so the self-audit's type check sees
        # the same project a developer does. This also type-checks the site.
        run: bun run check-types

      - name: Audit this repository for /report/
        # Published whatever the result; CI is where the gate lives.
        run: bun apps/cli/src/bin.ts . --format html,json,sarif,markdown --out apps/site/public/report --fail-on none --quiet
      - name: Regenerate the architecture page
        run: bun docs/architecture.ts

      - name: Build the site
        working-directory: apps/site
        env:
          SITE_URL: https://openaudit.se
          BASE_PATH: /
        run: bun run build

      - name: Deploy to Cloudflare
        working-directory: apps/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error title=Site not deployed::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (see apps/site/README.md)."
            exit 1
          fi
          bunx wrangler deploy
